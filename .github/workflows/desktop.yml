name: Desktop Build (macOS & Windows)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'shared/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run desktop:build
      - run: npm run desktop:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: release/*.dmg
          retention-days: 30

  build-win:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run desktop:build
      - run: npm run desktop:win
      - uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: release/*.exe
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [build-mac, build-win]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: release/mac/
      - uses: actions/download-artifact@v4
        with:
          name: win-installer
          path: release/win/
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            release/mac/*.dmg
            release/win/*.exe
          generate_release_notes: true