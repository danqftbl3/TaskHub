name: Mobile Build (iOS & Android)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'mobile/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS (EAS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: Configure EAS
        run: eas build:configure --non-interactive || true
      - name: Build iOS
        run: |
          cd mobile
          npm ci
          eas build --platform ios --profile production --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: mobile/
          retention-days: 30

  build-android:
    name: Build Android (EAS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: Build Android
        run: |
          cd mobile
          npm ci
          eas build --platform android --profile production --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: mobile/
          retention-days: 30